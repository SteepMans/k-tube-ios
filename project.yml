name: KTube
options:
  bundleIdPrefix: ru.steepmans
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The gateway address is not in the repository: CI passes it from a secret (KTUBE_GATEWAY_URL=https://...).
    # Empty: the app asks for the address together with the key.
    KTUBE_GATEWAY_URL: ""

targets:
  KTube:
    type: application
    platform: iOS
    sources:
      - App
      # Parsing, the gateway protocol, library and settings: the same code as the SwiftPM package Core with tests.
      - path: Core/Sources/KTubeCore
        group: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.steepmans.ktube
        PRODUCT_NAME: KTube
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: K-Tube
    info:
      path: Generated/KTube-Info.plist
      properties:
        CFBundleDisplayName: K-Tube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        KTubeGatewayURL: $(KTUBE_GATEWAY_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # sound in the background, on the lock screen and picture in picture
        UIBackgroundModes: [audio]
        # the app's own local proxy and video server on 127.0.0.1
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: ru.steepmans.ktube
            CFBundleURLSchemes: [ktube]
        # Only system encryption (TLS, Keychain).
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false

schemes:
  KTube:
    build:
      targets:
        KTube: all
    run:
      config: Debug
    archive:
      config: Release
